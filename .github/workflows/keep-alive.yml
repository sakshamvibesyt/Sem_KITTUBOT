
name: Gunnu Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Gunnu Health Endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://sem-kittubot.onrender.com/health
          echo ""
          echo "Gunnu health check completed."
          
