name: Gunnu Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Gunnu Health Endpoint
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "TARGET_URL secret is missing"
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 30 \
            "$TARGET_URL"
          echo ""
          echo "Gunnu health check completed."
          
